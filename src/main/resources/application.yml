spring:
  application:
    name: yotion

  # 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/yotion?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}  # 본인 MySQL 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create  # 개발 중에는 update, 운영에서는 validate
    show-sql: true  # SQL 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 설정 (나중에 WebSocket용)
  data:
    redis:
      host: localhost
      port: 6379

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT 설정
jwt:
  secret: your-secret-key-min-256-bits-long-please-change-this-in-production
  expiration: 86400000  # 24시간 (밀리초)

# 로그 레벨
logging:
  level:
    com.yourproject: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


#Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
